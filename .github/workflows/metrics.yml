name: Weekly reach metrics

# Snapshots GitHub's reach data into the ORPHAN `metrics-data` BRANCH (committed,
# so it becomes a permanent archive) and republishes the docs/site/ pages
# (landing + /metrics) to GitHub Pages.
#
# WHY A SEPARATE BRANCH: the archive must be committed -- see WHY DAILY below --
# but it must not be committed to `main`. One bookkeeping commit per day (plus
# one per release) buries the project's real history; eight had landed within
# two days of this workflow going live. The data is orphaned onto `metrics-data`,
# which shares no history with main and holds nothing else. Pages still deploys
# from THIS workflow (Settings -> Pages -> Source = "GitHub Actions"), so the
# branch is storage only and is never served.
#
# WHY DAILY: the traffic API is a ROLLING 14-DAY WINDOW that GitHub does not
# backfill. Each call returns 14 daily buckets, so any cadence under a fortnight
# observes every day -- but a gap longer than that loses those days for everyone,
# permanently. Weekly left exactly one run of margin, so a single failure was
# already a deadline; daily leaves thirteen, which turns a failed run from an
# emergency into a non-event. The extra cost is one ~60s job per day.
#
# The `release` trigger is the half that actually answers "monitor new releases
# faster": a release published at 09:00 appears on the page within a minute
# instead of waiting for the next cron. Its download counts start near zero by
# definition -- what it updates immediately is that the release EXISTS, and the
# version on the landing page.
#
# TOKEN: the traffic endpoints require PUSH access, which the default
# GITHUB_TOKEN may not satisfy. Set a repository secret METRICS_TOKEN (a
# fine-grained PAT with Administration: read-only on this repo) and it is used
# in preference. Without it the release history -- which is public -- is still
# collected, and the published page states which endpoints failed rather than
# rendering a hole as a quiet week.
#
# ONE-TIME SETUP: Settings -> Pages -> Source = "GitHub Actions".

on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  release:
    types: [published]     # a new release shows up immediately, not tomorrow
  workflow_dispatch:

permissions:
  contents: write   # commit the snapshot to the metrics-data branch
  pages: write      # publish
  id-token: write   # required by actions/deploy-pages

# Never let two runs publish at once, but do NOT cancel one in progress: it may
# already have banked a snapshot, and losing it loses those days for good.
concurrency:
  group: metrics-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The archive, as its own checkout. `metrics-data` is an ORPHAN branch:
      # data only, no history shared with main. fetch-depth 0 so the append
      # commit has a parent to rebase onto if two runs race.
      - name: Check out the archive branch
        uses: actions/checkout@v4
        with:
          ref: metrics-data
          path: _archive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot and render
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 py_tools/repo_metrics.py --data-dir _archive

      # Only the ARCHIVE is committed, and only to `metrics-data` -- never to
      # the branch this workflow was triggered on. docs/site/ is regenerated by
      # the step above and uploaded straight to Pages, so tracking it would add
      # a daily churn commit and collide with any local regeneration.
      - name: Commit the archive
        working-directory: _archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "metrics: reach snapshot $(date -u +%Y-%m-%d)"
            # Rebase rather than force: a concurrent run (the `release` trigger
            # can fire alongside the cron) must not be discarded by this one.
            git pull --rebase --autostash origin metrics-data
            git push origin HEAD:metrics-data
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@v4
